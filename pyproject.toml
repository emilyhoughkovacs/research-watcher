[project]
name = "research-watcher"
version = "0.1.0"
description = "Scheduled email digest of AI safety and interpretability research, with reproduction guides"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Emily Hough-Kovacs" }]

dependencies = [
    "anthropic>=0.40",
    "requests>=2.31",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
research-watch = "research_watcher.cli:main"

[project.urls]
Homepage = "https://github.com/emilyhoughkovacs/research-watcher"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_watcher"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
