# Copy to profile.yaml (gitignored) and edit.
#
# `identity`, `goal.areas` and `output` are all the digest needs.
# `skill` and `constraints` only matter if you use the repro pick; they
# calibrate feasibility, which asks "can this be run on THIS setup in the
# stated budget", not "is this reproducible in principle".

schedule:
  # How often you intend to run `research-watch digest`: daily | weekly |
  # monthly. This does NOT schedule anything — cron or GitHub Actions does
  # that (see workflows.example/). Setting it here tells the tool how much
  # ground one run covers, which sets the sanity cap, the default number of
  # expanded items, and the subject line.
  #
  # Keep it matched to your actual cron. A `weekly` cadence fired daily
  # still works, it just wastes a lenient cap.
  cadence: daily

  # Optional hard override of the cap on new items in a single run. Above
  # it, the run aborts instead of spending tokens, on the theory that a
  # sudden flood means a parser broke or state was reset.
  # Defaults by cadence: daily 25, weekly 60, monthly 150.
  # sanity_cap: 40

  # Backstop against re-sends: an unseen item older than this many days is
  # skipped, not reported. Catches the cases the seen-list can't — state not
  # persisting, or a source changing how it keys items. Unknown dates pass.
  # Defaults by cadence: daily 4, weekly 10, monthly 35. (News-sweep hits
  # use 30 regardless: press coverage lags the paper by days to weeks.)
  # date_floor_days: 4

budget:
  # Monthly spend cap, list price. When month-to-date plus a run's expected
  # cost would cross it, the optional search stages (news sweep, reach pass)
  # are skipped for that run and the footer says so. Summarization always
  # runs. `research-watch costs` shows spend so far and a projection.
  monthly_cap_usd: 20

identity:
  name: Your Name
  email: you@example.com
  # Only used by the repro pick's writeup outline. Leave as-is if unused.
  blog_repo: yourname/yourname.github.io
  blog_engine: jekyll              # jekyll | hugo | markdown
  blog_post_dir: _posts            # jekyll convention: YYYY-MM-DD-slug.md
  demo_repo_owner: yourname        # where the guide suggests creating a repo

goal:
  # Drives which items get the expanded treatment in the digest, and gives
  # the repro pick a sense of what counts as on-topic. Free text.
  areas:
    - mechanistic interpretability
    - evaluations
    - AI control

# ── everything below is only used by the repro pick ─────────────────
# Delete it if you set email.pick_enabled: false.
#
# The pick grades what the digest already archived, so schedule it no more
# often than the digest and give it a --days window at least as long as the
# gap between digest runs. A weekly pick over a monthly digest spends three
# weeks grading an empty window.

skill:
  # Prose, not parsed. Describe the setup honestly; the scoring is only as
  # good as this is. `unfamiliar` matters most: a paper requiring two tools
  # you have never used is a bad pick even when each looks small.
  python: "strong"
  pytorch: "comfortable with model internals and hooks; have not trained
            an SAE from scratch"
  familiar:
    - pytorch
    - huggingface transformers
    - numpy
    - matplotlib
  unfamiliar:
    - TransformerLens
    - SAELens
    - nnsight
  gap: "have not run a multi-seed experiment with proper controls"
  compute:
    local: "M-series MacBook (MPS), fine for <1B param inference"
    free: "Colab T4"
    willing_to_rent: true      # enables the high-signal / needs-GPU flag

# Questions you're actively working on. A paper bearing on one of these
# scores higher on signal. Leave the list empty if you'd rather not bias it.
threads:
  - id: example-thread
    summary: "one line on the open question"
    ref: "path/to/notes.md"

constraints:
  # Hard filter. A paper that can't be run in this budget can't be picked
  # regardless of how good it is.
  repro_budget_days: 1
  # What you intend to have at the end. Shapes how the guide scopes the
  # work. "a working run" is a perfectly valid single entry.
  deliverables:
    - a runnable implementation of the core experiment
    - notes on what did and didn't reproduce

output:
  # Where summaries, guides, and dedupe state get written. Relative to
  # --base-dir, which defaults to the current directory.
  #
  # These defaults keep everything inside the repo (out/ is gitignored),
  # so a fresh clone is fully self-contained and writes nothing outside
  # itself. Nothing else needs to exist for this to work.
  #
  # If you keep a notes repo or personal wiki, point these at it instead
  # and run with --base-dir /path/to/that/repo, e.g.:
  #   archive_dir: research/watch
  #   guides_dir:  research/repro-guides
  #   state_file:  research/.watch-state.json
  archive_dir: out/digest
  guides_dir: out/guides
  state_file: out/state.json

email:
  # No new items, no email — that's fixed, not configurable. Failing
  # sources and the stale-state warning ride along with the next digest
  # that has something in it.

  # How many items get the expanded treatment; the rest get one-line
  # headlines. Comment out to take the cadence default: 3 daily, 5 weekly,
  # 8 monthly.
  # top_n: 3

  # News sweep: web search for AI safety research that got press or broad
  # attention, resolved to the paper itself. Catches work from outside the
  # configured sources. ~$0.50 per sweep, the largest single cost.
  sweep_enabled: true
  # Sweep every N runs' worth of days. 2 halves the sweep's cost; the
  # window stretches to cover the gap, so nothing is skipped, just found a
  # day later.
  sweep_every_days: 1

  # Reach pass: web search for coverage of the top few items, which can
  # move them up the ranking. ~$0.13 each. Defaults to top_n.
  # reach_top_k: 3

  # The repro pick is optional. Set false for the digest only.
  pick_enabled: true

  # Send the pick email even when nothing cleared the bar ("no pick" is
  # itself information, and it's a two-line email). Ignored when
  # pick_enabled is false.
  send_empty_pick: true

scoring:
  weights:
    signal: 0.35               # does this matter for AI safety
    artifact_value: 0.35       # is there something worth producing
    feasibility: 0.30          # can YOU do it in repro_budget_days
  # Hard gate: below this, a paper cannot be picked. It routes to
  # the ⚡ escalation section instead. Raise it if picks keep overrunning.
  feasibility_gate: 6
