# Copy to profile.yaml (gitignored) and edit.
#
# `identity`, `goal.areas` and `output` are all the daily digest needs.
# `skill` and `constraints` only matter if you use the weekly pick; they
# calibrate feasibility, which asks "can this be run on THIS setup in the
# stated budget", not "is this reproducible in principle".

identity:
  name: Your Name
  email: you@example.com
  # Only used by the weekly pick's writeup outline. Leave as-is if unused.
  blog_repo: yourname/yourname.github.io
  blog_engine: jekyll              # jekyll | hugo | markdown
  blog_post_dir: _posts            # jekyll convention: YYYY-MM-DD-slug.md
  demo_repo_owner: yourname        # where the guide suggests creating a repo

goal:
  # Drives which items get the expanded treatment in the digest, and gives
  # the weekly pick a sense of what counts as on-topic. Free text.
  areas:
    - mechanistic interpretability
    - evaluations
    - AI control

# ── everything below is only used by the weekly pick ────────────────
# Delete it if you set email.weekly_enabled: false.

skill:
  # Prose, not parsed. Describe the setup honestly; the scoring is only as
  # good as this is. `unfamiliar` matters most: a paper requiring two tools
  # you have never used is a bad pick even when each looks small.
  python: "strong"
  pytorch: "comfortable with model internals and hooks; have not trained
            an SAE from scratch"
  familiar:
    - pytorch
    - huggingface transformers
    - numpy
    - matplotlib
  unfamiliar:
    - TransformerLens
    - SAELens
    - nnsight
  gap: "have not run a multi-seed experiment with proper controls"
  compute:
    local: "M-series MacBook (MPS), fine for <1B param inference"
    free: "Colab T4"
    willing_to_rent: true      # enables the high-signal / needs-GPU flag

# Questions you're actively working on. A paper bearing on one of these
# scores higher on signal. Leave the list empty if you'd rather not bias it.
threads:
  - id: example-thread
    summary: "one line on the open question"
    ref: "path/to/notes.md"

constraints:
  # Hard filter. A paper that can't be run in this budget can't win the
  # weekly pick regardless of how good it is.
  repro_budget_days: 1
  # What you intend to have at the end. Shapes how the guide scopes the
  # work. "a working run" is a perfectly valid single entry.
  deliverables:
    - a runnable implementation of the core experiment
    - notes on what did and didn't reproduce

output:
  # Where summaries, guides, and dedupe state get written. Relative to
  # --base-dir, which defaults to the current directory.
  #
  # These defaults keep everything inside the repo (out/ is gitignored),
  # so a fresh clone is fully self-contained and writes nothing outside
  # itself. Nothing else needs to exist for this to work.
  #
  # If you keep a notes repo or personal wiki, point these at it instead
  # and run with --base-dir /path/to/that/repo, e.g.:
  #   archive_dir: research/watch
  #   guides_dir:  research/repro-guides
  #   state_file:  research/.watch-state.json
  archive_dir: out/digest
  guides_dir: out/guides
  state_file: out/state.json

email:
  # Suppress the daily email when nothing new was found.
  suppress_empty_daily: true
  top_n: 3                     # expanded treatment; rest get headlines

  # The weekly pick is optional. Set false for the digest only.
  weekly_enabled: true

  # Send the Friday email even on an empty week ("nothing cleared the bar"
  # is itself information, and it's a two-line email). Ignored when
  # weekly_enabled is false.
  send_empty_weekly: true

scoring:
  weights:
    signal: 0.35               # does this matter for AI safety
    artifact_value: 0.35              # does replicating produce application signal
    feasibility: 0.30          # can YOU do it in repro_budget_days
  # Hard gate: below this, a paper cannot be the weekly pick. It routes to
  # the ⚡ escalation section instead. Raise it if picks keep overrunning.
  feasibility_gate: 6
