name: Research Watch — repro pick

# A stub, like the digest's: schedule and inputs here, everything else in
# research-watcher's reusable workflow.
#
# The pick grades what the digest archived, so don't run it more often than
# the digest, and keep `days` >= the gap between digest runs.

on:
  schedule:
    - cron: "17 15 * * 5"    # Fridays, UTC. Queued like any GitHub schedule.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the email instead of sending it"
        type: boolean
        default: false
      days:
        description: "How many days of archive to consider"
        type: number
        default: 7

permissions:
  contents: write

concurrency:
  group: research-watch
  cancel-in-progress: false

jobs:
  run:
    uses: emilyhoughkovacs/research-watcher/.github/workflows/research-watch.yml@main
    with:
      command: pick
      dry_run: ${{ inputs.dry_run == true }}
      days: ${{ inputs.days || 7 }}
      profile: profile.yaml
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
