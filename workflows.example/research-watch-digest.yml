name: Research Watch — digest

# A stub: *when* to run and *with what*. How a run works — install, run,
# commit back — lives in research-watcher's reusable workflow, so fixes
# there need no edit here.
#
# Copy into .github/workflows/ of the repo that should hold your profile,
# state and archive, then set three secrets (see the README).

on:
  schedule:
    # Pick ONE and set schedule.cadence in profile.yaml to match.
    #   daily     "47 15 * * *"
    #   weekly    "47 15 * * 1"    Mondays
    #   monthly   "47 15 1 * *"    the 1st
    # UTC. GitHub queues scheduled runs, so the email arrives later than this.
    - cron: "47 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "digest = normal run; baseline = mark all as seen; check = parse sources only; costs = spend report"
        type: choice
        options: [digest, baseline, check, costs]
        default: digest
      dry_run:
        description: "Print the email instead of sending it (digest only)"
        type: boolean
        default: false

permissions:
  contents: write        # the reusable workflow commits state and archive back

concurrency:
  group: research-watch
  cancel-in-progress: false

jobs:
  run:
    uses: emilyhoughkovacs/research-watcher/.github/workflows/research-watch.yml@main
    with:
      command: ${{ inputs.mode || 'digest' }}   # inputs are empty on scheduled runs
      dry_run: ${{ inputs.dry_run == true }}
      profile: profile.yaml                     # must be committed: CI can't read ignored files
    secrets:
      # Explicit, not `secrets: inherit`: GitHub documents inherit only for
      # callers in the same organization.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
